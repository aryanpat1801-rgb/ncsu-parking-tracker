# Always-on collector: runs on GitHub's machines, so it keeps logging while
# your laptop is off. Push this repo to GitHub and it starts on its own.
name: Collect parking data

on:
  schedule:
    # Every 10 minutes, 7am-5pm campus time only.
    #
    # GitHub cron is ALWAYS UTC and has no daylight-saving support, so this
    # window is written in UTC and has to be moved twice a year:
    #
    #   EDT (Mar-Nov, UTC-4)  7am-5pm ET  ->  "*/10 11-20 * * *"   <-- active
    #   EST (Nov-Mar, UTC-5)  7am-5pm ET  ->  "*/10 12-21 * * *"
    #
    # Leave the wrong one in place and you collect 6am-4pm instead. The local
    # Task Scheduler collector is unaffected -- it runs in real local time.
    - cron: "*/10 11-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let a slow run overlap the next one.
concurrency:
  group: collect-parking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # collect.py is stdlib-only, so there is nothing to pip install.
      - name: Poll the parking endpoint
        run: python collect.py --csv data/cloud-log.csv

      - name: Commit the new sample
        run: |
          git config user.name  "parking-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cloud-log.csv
          if git diff --staged --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "parking sample $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Another run may have pushed while this one was polling.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash
          done
          echo "could not push after 3 attempts" >&2
          exit 1
