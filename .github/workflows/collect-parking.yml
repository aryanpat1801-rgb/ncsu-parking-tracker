# Always-on collector: runs on GitHub's machines, so it keeps logging while
# your laptop is off.
#
# One trigger starts ONE LONG-LIVED COLLECTOR, not one sample. GitHub's cron
# is best effort -- a `*/10` schedule here was only being honoured about six
# times a day, ~90 minutes apart, so most 10-minute marks were never sampled
# and the endpoint cannot be asked about the past. cloud_run.py instead stays
# alive and polls the 10-minute grid itself, which needs cron to land only
# once rather than sixty times.
name: Collect parking data

on:
  schedule:
    # The cron is now just an ignition source, so it is scheduled EARLY and
    # WIDE rather than precisely: 10:00-22:59 UTC is 06:00-18:59 ET on EDT and
    # 05:00-17:59 ET on EST, giving a delayed firing an hour or more of slack
    # to still get a collector up before 7am. cloud_run.py waits for the real
    # 7am open and stops at the real 5pm close, on whichever offset applies,
    # so nothing here has to change at a DST flip.
    #
    # Those UTC hours never wrap past local midnight, so weekdays 1-5 here
    # really are Mon-Fri on campus.
    - cron: "*/10 10-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write        # so a collector can dispatch its own successor

# One collector at a time. cancel-in-progress: false means a firing that
# arrives mid-run waits instead of killing the live collector, then takes over
# the moment it finishes -- which is exactly the handover we want.
concurrency:
  group: collect-parking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # The hard GitHub cap is 6h; cloud_run.py hands over at 5h30m, so this is
    # only a backstop for a collector that has wedged.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # cloud_run.py is stdlib-only, so there is nothing to pip install.
      - name: Collect for as long as the campus window is open
        run: |
          git config user.name  "parking-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python cloud_run.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A manual "Run workflow" click takes one sample whatever the clock
          # says, so the workflow can be tested outside 7am-5pm.
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
