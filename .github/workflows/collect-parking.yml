# Always-on collector: runs on GitHub's machines, so it keeps logging while
# your laptop is off. Push this repo to GitHub and it starts on its own.
name: Collect parking data

on:
  schedule:
    # Target: every 10 minutes, 7am-5pm campus time, weekdays only.
    #
    # GitHub cron is ALWAYS UTC with no daylight-saving support, so no single
    # expression can express that year-round. This schedules the UNION of both
    # windows (11:00-21:59 UTC covers 7am-5pm ET in both EDT and EST) and lets
    # in_window.py decide at runtime which of those runs is really in-window.
    # That stays correct through every future DST transition with no edit.
    #
    # The window never crosses local midnight, so a UTC weekday here is always
    # the same calendar weekday on campus -- 1-5 really does mean Mon-Fri ET.
    - cron: "*/10 11-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# Never let a slow run overlap the next one.
concurrency:
  group: collect-parking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs on the runner's preinstalled python3; decides EDT vs EST for us.
      - name: Is the collection window open on campus?
        id: window
        run: python3 in_window.py
        env:
          # A manual "Run workflow" click collects regardless of the clock,
          # so the workflow can be tested outside the window.
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}

      - uses: actions/setup-python@v5
        if: steps.window.outputs.collect == 'true'
        with:
          python-version: "3.12"

      # collect.py is stdlib-only, so there is nothing to pip install.
      - name: Poll the parking endpoint
        if: steps.window.outputs.collect == 'true'
        run: python collect.py --csv data/cloud-log.csv

      - name: Commit the new sample
        if: steps.window.outputs.collect == 'true'
        run: |
          git config user.name  "parking-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cloud-log.csv
          if git diff --staged --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "parking sample $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Another run may have pushed while this one was polling.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash
          done
          echo "could not push after 3 attempts" >&2
          exit 1
