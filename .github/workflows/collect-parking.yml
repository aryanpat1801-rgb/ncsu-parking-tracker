# Always-on collector: runs on GitHub's machines, so it keeps logging while
# your laptop is off. Push this repo to GitHub and it starts on its own.
name: Collect parking data

on:
  schedule:
    # Every 5 minutes. GitHub treats cron as best-effort: runs are often
    # several minutes late and can be skipped entirely under load, so treat
    # this as "roughly every 5-15 minutes", not a precise clock.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let a slow run overlap the next one.
concurrency:
  group: collect-parking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # collect.py is stdlib-only, so there is nothing to pip install.
      - name: Poll the parking endpoint
        run: python collect.py --csv data/cloud-log.csv

      - name: Commit the new sample
        run: |
          git config user.name  "parking-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cloud-log.csv
          if git diff --staged --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "parking sample $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Another run may have pushed while this one was polling.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash
          done
          echo "could not push after 3 attempts" >&2
          exit 1
